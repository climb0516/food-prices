<!DOCTYPE html>
<!-- Created by 青云 on 2026/10/21. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>菜价物价 · 猪肉 鸡蛋 蔬菜 CPI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080a08;
      --panel: rgba(20,26,20,0.82);
      --panel-2: rgba(255,255,255,0.03);
      --hover: rgba(255,255,255,0.045);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.14);
      --grid: rgba(255,255,255,0.06);
      --text-1: #eef3ec;
      --text-2: #aab5a6;
      --text-3: #6f7a6b;
      --accent: #4ade80;
      --grad: linear-gradient(120deg, #4ade80 0%, #a3e635 50%, #facc15 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(74,222,128,0.11);
      --glow-2: rgba(250,204,21,0.07);
      --up: #f05252;          /* 涨：红（国内习惯），始终配 ▲ */
      --down: #22c55e;        /* 跌：绿，始终配 ▼ */
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;   /* 图表分类色（深色模式色阶） */
      --ok: #22c55e;
      --err: #ef4444;
      --kbd-bg: rgba(255,255,255,0.06);
    }
    :root[data-theme="light"] {
      --bg: #f8faf7;
      --panel: rgba(255,255,255,0.93);
      --panel-2: rgba(10,40,10,0.025);
      --hover: rgba(10,40,10,0.04);
      --line: rgba(10,40,10,0.08);
      --line-2: rgba(10,40,10,0.16);
      --grid: rgba(10,40,10,0.07);
      --text-1: #121a10;
      --text-2: #4e5a4a;
      --text-3: #8b9686;
      --accent: #16a34a;
      --grid-dot: rgba(10,40,10,0.06);
      --glow-1: rgba(74,222,128,0.09);
      --glow-2: rgba(250,204,21,0.06);
      --up: #dc2626;
      --down: #15803d;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
      --kbd-bg: rgba(10,40,10,0.05);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px 400px at 15% -5%, var(--glow-1), transparent 70%),
        radial-gradient(700px 500px at 95% 0%, var(--glow-2), transparent 70%),
        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 20px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; font-size: 15px; box-shadow: 0 0 20px var(--glow-1); }
    .logo small { font-weight: 500; font-size: 12px; color: var(--text-3); letter-spacing: 0; }
    .search {
      flex: 1; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 36px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow-1); }
    .search svg { color: var(--text-3); flex: none; }
    .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text-1); font: inherit; font-size: 13.5px; }
    .search input::placeholder { color: var(--text-3); }
    kbd { font-family: inherit; font-size: 11px; color: var(--text-3); background: var(--kbd-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
    .top-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .updated { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(34,197,94,0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
    .icon-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; display: grid; place-items: center; color: var(--text-2); flex: none; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout { max-width: 1400px; margin: 0 auto; padding: 24px 24px 64px; display: grid; grid-template-columns: 180px minmax(0, 1fr) 290px; gap: 24px; align-items: start; }
    .side { position: sticky; top: 84px; }
    .side-title { font-size: 11.5px; color: var(--text-3); padding: 0 10px; margin: 4px 0 8px; letter-spacing: .04em; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: none; background: none; cursor: pointer; text-align: left; color: var(--text-2); font-size: 13.5px; position: relative; }
    .nav-item:hover { background: var(--hover); color: var(--text-1); }
    .nav-item.active { background: var(--panel); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--grad); }

    .main-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .main-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .main-head h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .main-head p { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
    .tabs { display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
    .tab { padding: 5px 11px; border-radius: 7px; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--text-3); white-space: nowrap; }
    .tab:hover { color: var(--text-1); }
    .tab.active { background: var(--hover); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line-2); }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .muted { color: var(--text-3); }
    .empty { text-align: center; padding: 40px 0; color: var(--text-3); }
    .loading { padding: 80px 0; text-align: center; color: var(--text-3); }
    .section-title { font-size: 13px; color: var(--text-3); margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .section-title:first-child { margin-top: 0; }
    .section-title b { color: var(--text-1); font-size: 15px; }
    .note { font-size: 12px; color: var(--text-3); margin-top: 10px; line-height: 1.6; }
    .num { font-variant-numeric: tabular-nums; }
    .up { color: var(--up); }
    .down { color: var(--down); }

    /* ── KPI ── */
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 8px; }
    .kpi { padding: 14px 16px; }
    .kpi .k { font-size: 12px; color: var(--text-3); }
    .kpi .v { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
    .kpi .v small { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 3px; }
    .kpi .s { font-size: 12.5px; color: var(--text-2); display: flex; gap: 10px; flex-wrap: wrap; }
    .kpi svg { display: block; margin-top: 6px; width: 100%; }   /* 跟随卡片宽度，手机两列时不撑破 */

    /* ── Price table ── */
    .ptable { width: 100%; border-collapse: collapse; }
    .ptable th { font-size: 12px; font-weight: 500; color: var(--text-3); text-align: right; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .ptable th:first-child { text-align: left; }
    .ptable td { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ptable td:first-child { text-align: left; }
    .ptable tr.row { cursor: pointer; }
    .ptable tr.row:hover td { background: var(--hover); }
    .ptable tr.row.open td { background: var(--hover); }
    .ptable tr.grp td { font-size: 12px; color: var(--text-3); background: var(--panel-2); padding: 6px 14px; text-align: left; }
    .ptable tr:last-child td { border-bottom: none; }
    .ptable .price { font-weight: 700; font-size: 14.5px; }
    .ptable .spark { width: 110px; }
    .ptable tr.detail td { padding: 4px 14px 14px; cursor: default; text-align: left; white-space: normal; }
    .stale { font-size: 11px; color: var(--text-3); margin-left: 4px; }

    /* ── Charts ── */
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }   /* 手机横向拖动看数值 */
    .chart .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line-2); border-radius: 9px; padding: 7px 10px; font-size: 12px; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transition: opacity .1s; z-index: 5; }
    .chart .tip b { display: block; font-size: 12px; color: var(--text-3); font-weight: 500; margin-bottom: 2px; }
    .chart .tip .r { display: flex; align-items: center; gap: 6px; color: var(--text-1); }
    .chart .tip i { width: 10px; height: 2px; border-radius: 1px; display: inline-block; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
    .chart-card { padding: 16px 16px 10px; }
    .chart-meta { display: flex; gap: 18px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; margin-bottom: 8px; }
    .chart-meta b { color: var(--text-1); font-variant-numeric: tabular-nums; }

    /* ── Rank / index ── */
    .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .rank-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
    .rank-row:last-child { border-bottom: none; }
    .rank-row .n { width: 18px; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
    .rank-row .l { flex: 1; min-width: 0; }
    .rank-row .p { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 12.5px; }
    .rank-row .c { width: 64px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .idx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .idx { padding: 12px 14px; }
    .idx .k { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .idx .v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .idx .s { font-size: 12px; font-variant-numeric: tabular-nums; }

    /* ── CPI ── */
    .bars { display: flex; flex-direction: column; gap: 7px; padding: 14px 16px; }
    .bar-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 62px; align-items: center; gap: 10px; font-size: 13px; }
    .bar-row .lab { color: var(--text-2); white-space: nowrap; }
    .bar-row .track { position: relative; height: 14px; }
    .bar-row .track::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line-2); }
    .bar-row .fill { position: absolute; top: 2px; height: 10px; border-radius: 4px; }
    .bar-row .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .say { padding: 14px 16px; font-size: 13.5px; color: var(--text-2); line-height: 1.8; }
    .say b { color: var(--text-1); }
    .ctable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .ctable th, .ctable td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ctable th:first-child, .ctable td:first-child { text-align: left; }
    .ctable th { color: var(--text-3); font-weight: 500; }
    .scroll-x { overflow-x: auto; }
    .linkbtn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12.5px; }

    /* ── Aside ── */
    .aside { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 14px; }
    .widget { padding: 14px 16px; }
    .widget h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .w-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
    .w-row:last-child { border-bottom: none; }
    .w-row .l { color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .w-row .r { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .st-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--ok); }
    .st-dot.bad { background: var(--err); }
    .st-dot.stale { background: #f59e0b; }
    .w-note { font-size: 12px; color: var(--text-3); line-height: 1.65; }

    @media (max-width: 1180px) {
      .layout { grid-template-columns: 160px minmax(0, 1fr); }
      .aside { position: static; grid-column: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }   /* 右栏挪到正文下面 */
    }
    @media (max-width: 860px) {
      .topbar-inner { padding: 0 16px; gap: 10px; }
      .logo small, .updated, kbd, .top-right a.icon-btn { display: none; }
      .logo { font-size: 15px; }
      .search { min-width: 0; flex: 1 1 0; }
      .layout { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 48px; gap: 16px; }
      .side { position: static; }
      .side-title { display: none; }
      .side nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
      .nav-item { width: auto; white-space: nowrap; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two { grid-template-columns: minmax(0, 1fr); }
      .ptable th, .ptable td { padding: 8px 8px; }
      .ptable .hide-m { display: none; }
      .ptable .spark { width: 72px; }
      .ptable { min-width: 460px; }   /* 太窄时外层横滑，不挤压列 */
      .aside { grid-column: auto; }
      .bar-row { grid-template-columns: 70px minmax(0, 1fr) 54px; }
    }
    /* ── 详情抽屉 + 列表页（通用组件 kit：电脑右侧滑出，手机底部升起；地址 #/item/类型/id、#/list/key） ── */
    :root { --kit-bg: var(--bg, #0b0a10); --kit-panel: var(--panel, var(--card, rgba(255,255,255,.04))); --kit-line: var(--line, var(--sep, rgba(255,255,255,.08)));
      --kit-line2: var(--line-2, rgba(255,255,255,.14)); --kit-t1: var(--text-1, #f1eff7); --kit-t2: var(--text-2, #a39fb3); --kit-t3: var(--text-3, #6b677a);
      --kit-accent: var(--accent, #a3e635); --kit-hover: var(--hover, rgba(255,255,255,.05)); }
    .kit-mask { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.38); display: none; }
    .kit-mask.open { display: block; }
    .kit-sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(440px, 42vw, 620px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; color: var(--kit-t1); border-radius: 18px;
      background: linear-gradient(var(--kit-panel), var(--kit-panel)), var(--kit-bg); box-shadow: 0 0 0 1px var(--kit-line2), 0 24px 60px rgba(0,0,0,.45);
      animation: kit-in .24s ease-out; }
    @keyframes kit-in { from { transform: translateX(40px); opacity: 0; } }
    .kit-sheet.kit-small { bottom: auto; }
    .kit-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      background: rgba(0,0,0,.5); color: #fff; font-size: 15px; display: grid; place-items: center; }
    .kit-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .kit-cover { aspect-ratio: 16/9; background: var(--kit-hover) center / cover no-repeat; position: relative; }
    .kit-cover.tall { aspect-ratio: auto; height: 280px; background-size: contain; background-color: #000; }
    .kit-cover.ph { display: grid; place-items: center; font-size: 56px; aspect-ratio: 16/6; }
    .kit-head { padding: 18px 20px 4px; display: flex; gap: 14px; align-items: flex-start; }
    .kit-head .kit-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 14px; background: var(--kit-hover) center / cover no-repeat;
      display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .kit-head .kit-t { flex: 1; min-width: 0; padding-right: 30px; }
    .kit-cover + .kit-head .kit-t { padding-right: 0; }
    .kit-head h2 { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .kit-sub { color: var(--kit-t2); font-size: 13px; margin-top: 4px; }
    .kit-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kit-tags span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--kit-hover); color: var(--kit-t2); }
    .kit-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kit-big b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-body { padding: 4px 20px 20px; }
    .kit-sec { padding-top: 16px; }
    .kit-sec + .kit-sec { margin-top: 6px; border-top: 1px solid var(--kit-line); }
    .kit-sec h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .kit-sec h4 small { font-size: 12px; color: var(--kit-t3); font-weight: 500; }
    .kit-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .kit-kv div { background: var(--kit-hover); border-radius: 10px; padding: 8px 11px; min-width: 0; }
    .kit-kv small { display: block; font-size: 11px; color: var(--kit-t3); }
    .kit-kv b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .kit-p { font-size: 13.5px; line-height: 1.75; color: var(--kit-t2); white-space: pre-line; }
    .kit-rows { display: flex; flex-direction: column; }
    .kit-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--kit-line); font-size: 13px; text-decoration: none; color: inherit; }
    .kit-row:first-child { border-top: 0; }
    .kit-row[data-kit-go], a.kit-row { cursor: pointer; }
    .kit-row[data-kit-go]:hover .kit-rt, a.kit-row:hover .kit-rt { color: var(--kit-accent); }
    .kit-row .kit-rt { flex: 1; min-width: 0; line-height: 1.45; }
    .kit-row .kit-rm { color: var(--kit-t3); font-size: 12px; white-space: nowrap; }
    .kit-row img, .kit-row .kit-ri { width: 54px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--kit-hover); }
    .kit-acts { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--kit-line); }
    .kit-acts a, .kit-acts button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px; border-radius: 11px;

<script>
// ── kit：详情抽屉 + 列表页路由（各站通用，内联在页面里）──
// 用法：
//   KIT.item('news', id => ({ title, sub, cover, thumb, tags:[], big, body:'<div class="kit-sec">…</div>', acts:[{text, href, pri}] }))
//   KIT.list('news', (param, query) => { … 把列表页 HTML 写进容器 … })
//   条目元素加 data-kit-item="news/<id>" 即可点击打开详情；「查看更多」写成 <a href="#/list/news">
//   站点首页渲染函数里先调用 KIT.route() —— 返回 true 表示当前是列表页（已渲染），首页不用再渲染
const KIT = (() => {
  const items = {}, lists = {};
  let mask, homeY = 0, fromHome = 0, lastHash = location.hash, onHome = null, listBox = null;
  const kesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parse = h => {
    const m = (h === undefined ? location.hash : h).match(/^#\/(item|list)\/([^?]+?)(?:\?(.*))?$/);
    if (!m) return null;
    const [type, ...rest] = m[2].split('/');
    return { kind: m[1], type: decodeURIComponent(type), id: rest.map(decodeURIComponent).join('/'), q: new URLSearchParams(m[3] || '') };
  };
  function ensure() {
    if (mask) return;
    mask = document.createElement('div');
    mask.className = 'kit-mask';
    mask.innerHTML = '<div class="kit-sheet" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-kit-close]')) close(); });
  }
  function render(d) {
    ensure();
    const cover = d.cover ? `<div class="kit-cover ${d.coverTall ? 'tall' : ''}" style="background-image:url('${kesc(d.cover).replace(/'/g, '%27')}')"></div>`
      : d.coverIcon ? `<div class="kit-cover ph" style="background:${d.coverBg || 'var(--kit-hover)'}">${d.coverIcon}</div>` : '';
    const thumb = !d.cover && !d.coverIcon && (d.thumb || d.thumbIcon)
      ? `<div class="kit-thumb" style="${d.thumb ? `background-image:url('${kesc(d.thumb).replace(/'/g, '%27')}')` : ''}${d.thumbBg ? `;background-color:${d.thumbBg}` : ''}">${d.thumb ? '' : d.thumbIcon}</div>` : '';
    const acts = (d.acts || []).filter(a => a && (a.href || a.onclick));
    mask.firstElementChild.innerHTML = `<button class="kit-x" data-kit-close aria-label="关闭">✕</button>
      <div class="kit-scroll">${cover}
        <div class="kit-head">${thumb}<div class="kit-t"><h2>${kesc(d.title)}</h2>${d.sub ? `<div class="kit-sub">${d.sub}</div>` : ''}
          ${(d.tags || []).filter(Boolean).length ? `<div class="kit-tags">${d.tags.filter(Boolean).join('')}</div>` : ''}${d.big ? `<div class="kit-big">${d.big}</div>` : ''}</div></div>
        <div class="kit-body">${d.body || ''}</div></div>
      ${acts.length ? `<div class="kit-acts">${acts.map((a, i) => a.href
        ? `<a class="${a.pri || (i === 0 && acts.length < 3) ? 'pri' : ''}" href="${kesc(a.href)}" ${a.self ? '' : 'target="_blank" rel="noopener"'}>${a.text}</a>`
        : `<button class="${a.pri ? 'pri' : ''}" data-kit-act="${i}">${a.text}</button>`).join('')}</div>` : ''}`;
    acts.forEach((a, i) => { if (!a.href) { const b = mask.querySelector(`[data-kit-act="${i}"]`); if (b) b.onclick = a.onclick; } });
    mask.firstElementChild.classList.toggle('kit-small', !!d.small);       // 内容很少的提示：抽屉按内容高度
    mask.querySelector('.kit-scroll').scrollTop = 0;
    mask.classList.add('open');

  }
  // 打开详情：写进地址（可分享；浏览器返回 = 关闭）
  function open(key) {
    const target = '#/item/' + key;
    if (location.hash === target) return show(parse(target));
    ensure();
    if (parse()?.kind === 'item') history.replaceState(history.state, '', target);
    else { mask.dataset.base = location.hash; history.pushState({ kit: 1 }, '', target); }
    lastHash = target;
    show(parse(target));
  }
  function show(r) {
    const fn = items[r.type];
    const d = fn && fn(r.id, r.q);
    // 找不到这一条（已下榜 / 过期 / 链接是旧数据里的）：给个提示，而不是什么都不弹
    render(d || { small: true, title: '这条内容已不在当前数据里', sub: '数据每天自动更新，它可能已经下榜、过期或被合并到别的条目', thumbIcon: '🕓',
      body: KIT.p('可以回到首页看最新的内容，或用页面顶部的搜索找一找。'), acts: [{ text: '回到首页', href: '#', self: true, pri: true }] });
    return !!d;
  }
  function close(silent) {
    if (!mask || !mask.classList.contains('open')) return;
    mask.classList.remove('open');
    document.body.style.overflow = '';
    if (!silent && parse()?.kind === 'item') {
      if (history.state && history.state.kit) history.back();          // 从页面里点开的：退回去
      else { history.replaceState(null, '', mask.dataset.base || location.pathname + location.search); lastHash = location.hash; }   // 直接打开的分享链接
    }
  }
  // 当前地址是列表页时渲染列表页并返回 true；首页时返回 false
  function route(box) {
    if (box) listBox = box;
    const r = parse();
    if (r && r.kind === 'list' && lists[r.type]) { lists[r.type](r.id, r.q, listBox); return true; }
    return false;
  }
  // 列表页的公共外壳：返回按钮 + 标题 + 子分类 + 排序
  function shell({ title, note, chips, sort, sortVal, body, more }) {
    return `<div class="kit-lhead"><button class="kit-back" data-kit-back title="返回">‹</button><h2>${kesc(title)}</h2>${note ? `<small>${note}</small>` : ''}</div>
      ${chips || sort ? `<div class="kit-lbar"><div class="kit-chips">${(chips || []).map(c => `<a class="${c.on ? 'on' : ''}" href="${kesc(c.href)}">${kesc(c.text)}${c.count != null ? `<small>${c.count}</small>` : ''}</a>`).join('')}</div>
        ${sort ? `<select class="kit-sel" data-kit-sort>${sort.map(([v, n]) => `<option value="${kesc(v)}" ${v === sortVal ? 'selected' : ''}>${kesc(n)}</option>`).join('')}</select>` : ''}</div>` : ''}
      ${body}${more ? `<button class="kit-more" data-kit-more>${more}</button>` : ''}`;
  }
  function init(home) {
    onHome = home;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-kit-item],[data-kit-go],[data-kit-back]');
      if (!t) return;
      const inner = e.target.closest('a[href],button,input,select,label,summary');   // 卡片里的其它按钮 / 链接（关注、复制…）优先
      if (inner && inner !== t && t.contains(inner)) return;
      e.preventDefault();
      if (t.dataset.kitBack !== undefined) { fromHome && history.length > fromHome ? history.go(-fromHome) : (location.hash = ''); return; }
      open(t.dataset.kitItem || t.dataset.kitGo);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    window.addEventListener('hashchange', () => {
      const r = parse();
      let was = parse(lastHash), steps = 1;
      if (was && was.kind === 'item') {                                 // 从详情离开
        const base = mask && mask.dataset.base !== undefined ? mask.dataset.base : '';
        if (location.hash === base) { lastHash = location.hash; close(true); return; }   // 只是关掉详情，底下页面不动
        was = parse(base); steps = 2;                                   // 在详情里点了别的列表：按详情底下那页算，返回要退两步
      }
      lastHash = location.hash;
      if (r && r.kind === 'item') { show(r); return; }
      close(true);
      const wasHome = !was;
      if (r && r.kind === 'list') {
        if (wasHome) { homeY = scrollY; fromHome = steps; }
        onHome && onHome();
        if (wasHome || was.type !== r.type) scrollTo(0, 0);
      } else {
        onHome && onHome();
        if (fromHome) { scrollTo(0, homeY); fromHome = 0; }
      }
    });
    // 直接打开带 #/item/ 的链接（比如大屏跳过来）：页面数据读完后由站点调用 KIT.boot()
  }
  function boot() { const r = parse(); if (r && r.kind === 'item') show(r); }
  return { item: (t, fn) => (items[t] = fn), list: (t, fn) => (lists[t] = fn), open, close, route, shell, init, boot, parse, esc: kesc,
    // 小工具：详情里的键值格、段落、关联列表
    kv: rows => { const r = rows.filter(x => x && x[1] != null && x[1] !== ''); return r.length ? `<div class="kit-kv">${r.map(([k, v]) => `<div><small>${kesc(k)}</small><b title="${kesc(v)}">${kesc(v)}</b></div>`).join('')}</div>` : ''; },
    sec: (title, html, note) => html ? `<div class="kit-sec"><h4>${title}${note ? `<small>${note}</small>` : ''}</h4>${html}</div>` : '',
    p: t => t ? `<p class="kit-p">${kesc(t)}</p>` : '',
  };
})();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('fp:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fp:' + k, JSON.stringify(v)); } catch {} },
};
const GROUPS = ['肉', '蛋', '菜', '果', '鱼虾'];
const CPI_NAME = { cpi: 'CPI 总体', food: '食品', core: '核心 CPI', pork: '猪肉', veg: '鲜菜', egg: '蛋类', fruit: '鲜果', beef: '牛肉', mutton: '羊肉', aquatic: '水产品', grain: '粮食', oil: '食用油', meat: '畜肉类' };
const CPI_LINES = [['cpi', 'var(--s1)'], ['pork', 'var(--s2)'], ['veg', 'var(--s3)'], ['egg', 'var(--s4)']];   // 固定顺序，颜色跟着品类走

let D = null;
const state = { view: store.get('view', 'home'), q: '', range: store.get('range', 90), cpiTable: false };

// ── 工具 ──
const pct = v => v == null || !isFinite(v) ? '—' : `${v > 0 ? '▲' : v < 0 ? '▼' : ''}${Math.abs(v).toFixed(1)}%`;
const cls = v => v > 0.05 ? 'up' : v < -0.05 ? 'down' : 'muted';
const yuan = v => v == null ? '—' : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
const md = iso => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
const ym = m => `${m.slice(2, 4)}.${+m.slice(5)}`;
function ago(t) {
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
const jin = r => r.unit === '元/公斤' && r.price != null ? r.price / 2 : r.price;   // 全国榜单价格换算成元/斤
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

// 单品：最新价、N 天前的价（取不晚于该日的最近一个报价）
function series(id) { return Object.entries(D.xinfadi[id] || {}); }
function stat(id) {
  const s = series(id);
  if (!s.length) return null;
  const [lastDay, last] = s.at(-1);
  const before = n => { const cut = addDays(lastDay, -n); for (let i = s.length - 1; i >= 0; i--) if (s[i][0] <= cut) return s[i][1]; return null; };
  const chg = n => { const b = before(n); return b ? (last / b - 1) * 100 : null; };
  const vals = s.slice(-90).map(x => x[1]);
  return { last, lastDay, d1: chg(1), d7: chg(7), d30: chg(30), min: Math.min(...vals), max: Math.max(...vals), avg: vals.reduce((a, b) => a + b, 0) / vals.length };
}

// ── 图表（纯 SVG） ──
const CHARTS = {};
let chartSeq = 0;
function sparkline(points, w = 110, h = 28, color = 'var(--text-2)') {
  if (points.length < 2) return '';
  const ys = points.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${(i / (points.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (p[1] - lo) / span * (h - 6)).toFixed(1)}`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
// lines: [{name, color, points:[[xLabel, y]]}]，所有线共用同一组 x；fmt 格式化 y；zero 是否画 0 线
// 画布宽度按容器取：手机用较小的 viewBox，缩放后字不会太小；w 可指定（详情抽屉里用）
const narrow = () => innerWidth < 760;
function lineChart(lines, { height = 240, fmt = v => v, zero = false, unit = '', xfmt = x => x, w } = {}) {
  const id = 'c' + (++chartSeq);
  const W = w || (narrow() ? 380 : 720), H = narrow() ? Math.round(height * 0.8) : height, L = 46, R = 16, T = 12, B = 26;
  const xs = lines[0].points.map(p => p[0]);
  const all = lines.flatMap(l => l.points.map(p => p[1])).filter(v => v != null);
  let lo = Math.min(...all), hi = Math.max(...all);
  if (zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const x = i => L + (xs.length < 2 ? 0 : i / (xs.length - 1) * (W - L - R));
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = 4, grid = Array.from({ length: ticks + 1 }, (_, i) => lo + (hi - lo) * i / ticks);
  const step = Math.max(1, Math.ceil(xs.length / 6));
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lines.map(l => l.name).join('、'))}走势">
    ${grid.map(g => `<line x1="${L}" x2="${W - R}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${L - 8}" y="${(y(g) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--text-3)">${esc(fmt(g))}</text>`).join('')}
    ${zero && lo < 0 && hi > 0 ? `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)" stroke-width="1"/>` : ''}
    ${xs.map((v, i) => i % step === 0 || i === xs.length - 1 ? `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === xs.length - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--text-3)">${esc(xfmt(v))}</text>` : '').join('')}
    ${lines.map(l => {
      let d = '', pen = false;
      l.points.forEach((p, i) => { if (p[1] == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`; pen = true; });
      return `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }).join('')}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    ${lines.map((l, k) => `<circle class="dot" data-k="${k}" r="4" fill="${l.color}" stroke="var(--bg)" stroke-width="2" opacity="0"/>`).join('')}
    <rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
  </svg>`;
  CHARTS[id] = { lines, xs, x, y, W, fmt, unit, xfmt };
  return `<div class="chart" data-chart="${id}">${svg}<div class="tip"></div></div>`;
}
// 悬停：十字线 + 提示框（事件委托）
document.addEventListener('pointermove', e => {
  const box = e.target.closest?.('.chart');
  document.querySelectorAll('.chart').forEach(c => { if (c !== box) hideTip(c); });
  if (!box) return;
  const c = CHARTS[box.dataset.chart]; if (!c) return;
  const svg = box.querySelector('svg'), r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * c.W;
  let best = 0, bd = Infinity;
  c.xs.forEach((_, i) => { const d = Math.abs(c.x(i) - sx); if (d < bd) { bd = d; best = i; } });
  const px = c.x(best);
  const xh = svg.querySelector('.xh'); xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('opacity', 1);
  svg.querySelectorAll('.dot').forEach(dot => {
    const v = c.lines[dot.dataset.k].points[best]?.[1];
    if (v == null) { dot.setAttribute('opacity', 0); return; }
    dot.setAttribute('cx', px); dot.setAttribute('cy', c.y(v)); dot.setAttribute('opacity', 1);
  });
  const tip = box.querySelector('.tip');
  tip.innerHTML = `<b>${esc(c.xfmt(c.xs[best], true))}</b>${c.lines.map(l => { const v = l.points[best]?.[1]; return v == null ? '' : `<div class="r"><i style="background:${l.color}"></i>${esc(l.name)} <span class="num">${esc(c.fmt(v, true))}${c.unit}</span></div>`; }).join('')}`;
  tip.style.opacity = 1;
  const bx = box.getBoundingClientRect(), left = px / c.W * r.width;
  tip.style.left = Math.min(Math.max(0, left + 12), bx.width - tip.offsetWidth) + 'px';
  tip.style.top = '6px';
});
function hideTip(box) {
  box.querySelector('.tip') && (box.querySelector('.tip').style.opacity = 0);
  box.querySelectorAll('.xh,.dot').forEach(n => n.setAttribute('opacity', 0));
}

  const fmt = (v, full) => (v > 0 ? '+' : '') + v.toFixed(full ? 1 : 0) + '%';
  return { title: `CPI · ${CPI_NAME[k]}`, sub: `国家统计局 · ${m.slice(0, 4)} 年 ${+m.slice(5)} 月居民消费价格`, thumbIcon: '📊', thumbBg: 'color-mix(in srgb, var(--s1) 22%, transparent)',
    big: `<b class="${cls(c.yoy)}">${fmt(c.yoy, true)}</b><span class="muted">同比</span><span class="${cls(c.mom)}">${fmt(c.mom, true)}</span><span class="muted">环比</span>`,
    body: KIT.sec(`近 ${months.length} 个月`, `<div class="legend"><span><i style="background:var(--s1)"></i>同比</span><span><i style="background:var(--s4)"></i>环比</span></div>
        ${lineChart([{ name: '同比', color: 'var(--s1)', points: months.map(mm => [mm, D.cpi[mm][k].yoy]) }, { name: '环比', color: 'var(--s4)', points: months.map(mm => [mm, D.cpi[mm][k].mom]) }],
          { height: 220, zero: true, fmt, xfmt: (mm, full) => full ? `${mm.slice(0, 4)} 年 ${+mm.slice(5)} 月` : ym(mm), w: drawerW() })}`, '和去年同月 / 上月比')
      + KIT.sec('逐月数据', `<div class="scroll-x"><table class="ctable"><thead><tr><th>月份</th><th>同比</th><th>环比</th><th></th></tr></thead><tbody>${[...months].reverse().map(mm => { const x = D.cpi[mm][k];
          return `<tr><td>${mm}</td><td class="${cls(x.yoy)}">${fmt(x.yoy, true)}</td><td class="${cls(x.mom)}">${fmt(x.mom, true)}</td><td>${D.cpi[mm].url ? `<a href="${esc(D.cpi[mm].url)}" target="_blank" rel="noopener" class="muted">公报 ↗</a>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`)
      + KIT.sec('其它品类', `<div class="kit-rows">${Object.keys(CPI_NAME).filter(x => x !== k && D.cpi[m][x]).map(x => `<div class="kit-row" data-kit-go="cpi/${x}"><span class="kit-rt">${CPI_NAME[x]}</span><span class="kit-rm">同比 ${chg(D.cpi[m][x].yoy)}</span></div>`).join('')}</div>`),
    acts: [{ text: '统计局公报原文 ↗', href: url }] };
});
KIT.item('rank', name => {
  const r = D.rank.find(x => x.name === name); if (!r) return null;
  const last = r.last == null ? null : r.unit === '元/公斤' ? r.last / 2 : r.last;
  const h = Object.entries(D.rank_hist?.[name] || {});
  const others = D.rank.filter(x => x !== r && (x.chg > 0) === (r.chg > 0));
  return { title: name, sub: `农业农村部全国批发均价 · ${esc(r.date)}`, thumbIcon: r.chg > 0 ? '📈' : '📉', thumbBg: `color-mix(in srgb, ${r.chg > 0 ? 'var(--up)' : 'var(--down)'} 20%, transparent)`,
    tags: [tag(r.chg > 0 ? '今日涨幅榜' : '今日跌幅榜')],
    big: `<b>${yuan(jin(r))}</b><span class="muted">元/斤</span>${chg(r.chg)}<span class="muted">较前一天</span>`,
    body: KIT.sec('今日行情', KIT.kv([['今日均价', yuan(jin(r)) + ' 元/斤'], ['前一天', last == null ? '' : yuan(last) + ' 元/斤'], ['涨跌', pct(r.chg)],
        ['原始报价', r.price == null ? '' : `${r.price.toFixed(2)} ${r.unit}`]]))
      + (h.length >= 2 ? KIT.sec('走势', lineChart([{ name, color: 'var(--s1)', points: h }], { height: 180, fmt: v => yuan(v), unit: ' 元/斤', xfmt: (d, full) => full ? d : md(d), w: drawerW() }), `${h.length} 天 · 上榜时才有记录`)
        : KIT.sec('走势', KIT.p('榜单接口只给当天和前一天，走势从上线后每天累积；该品种上榜的日子越多，这里的走势越完整。')))
      + KIT.sec(r.chg > 0 ? '同在涨幅榜' : '同在跌幅榜', `<div class="kit-rows">${others.map(x => `<div class="kit-row" data-kit-go="rank/${encodeURIComponent(x.name)}"><span class="kit-rt">${esc(x.name)}</span><span class="kit-rm">${yuan(jin(x))} 元/斤 · ${chg(x.chg)}</span></div>`).join('')}</div>`),
    acts: [{ text: '全国农产品批发价格 ↗', href: 'https://pfsc.agri.cn/' }] };
});
KIT.item('index', name => {
  const x = D.moa_index_today.find(i => i.name === name); if (!x) return null;
  const h = Object.entries(D.moa_index_hist?.[name] || {}), ch = x.prev ? (x.value / x.prev - 1) * 100 : null;
  return { title: name.replace(/[“”]/g, ''), sub: `农业农村部全国农产品批发价格指数 · ${x.date}`, thumbIcon: '📈', thumbBg: 'color-mix(in srgb, var(--s3) 22%, transparent)',
    big: `<b>${x.value.toFixed(2)}</b>${chg(ch)}<span class="muted">较前一天</span>`,
    body: KIT.sec('数值', KIT.kv([['今日', x.value.toFixed(2)], ['前一天', x.prev?.toFixed(2)], ['已累积', h.length + ' 天']]))
      + (h.length >= 2 ? KIT.sec('走势', lineChart([{ name: name.replace(/[“”]/g, ''), color: 'var(--s3)', points: h }], { height: 180, fmt: v => v.toFixed(1), xfmt: (d, full) => full ? d : md(d), w: drawerW() }), `${h.length} 天`) : '')
      + KIT.sec('说明', KIT.p(`指数接口只给当天和前一天，历史从上线当天开始每天累积${h.length < 7 ? `，目前只有 ${h.length} 天` : ''}。指数以 2015 年为基期（=100）。`))
      + KIT.sec('其它指数', `<div class="kit-rows">${D.moa_index_today.filter(i => i !== x).map(i => `<div class="kit-row" data-kit-go="index/${encodeURIComponent(i.name)}"><span class="kit-rt">${esc(i.name.replace(/[“”]/g, ''))}</span><span class="kit-rm">${i.value.toFixed(2)} ${chg(i.prev ? (i.value / i.prev - 1) * 100 : null)}</span></div>`).join('')}</div>`),
    acts: [{ text: '全国农产品批发价格 ↗', href: 'https://pfsc.agri.cn/' }] };
});

// 列表页：全部品种涨跌
const LPAGE = 30;
let listN = LPAGE;
const MSORT = [['d7', '周涨幅从高到低'], ['-d7', '周跌幅从高到低'], ['d30', '月涨幅从高到低'], ['-d30', '月跌幅从高到低'], ['d1', '较昨日涨幅']];
const moversHref = (g, sort) => '#/list/movers' + ((p => p.toString() ? '?' + p : '')(new URLSearchParams([...(g ? [['g', g]] : []), ...(sort && sort !== 'd7' ? [['sort', sort]] : [])])));
KIT.list('movers', (_, q, box) => {
  const g = GROUPS.includes(q.get('g')) ? q.get('g') : '', sort = MSORT.some(([v]) => v === q.get('sort')) ? q.get('sort') : 'd7';
  const key = sort.replace('-', ''), all = moversAll(key).filter(x => !g || x.b.group === g);
  if (sort.startsWith('-')) all.reverse();
  box.innerHTML = KIT.shell({ title: '全部品种涨跌', note: `${all.length} 个品种 · 北京新发地批发价`,
    chips: [['', '全部'], ...GROUPS.map(x => [x, x])].map(([k, n]) => ({ text: n, href: moversHref(k, sort), on: k === g, count: D.basket.filter(b => (!k || b.group === k) && stat(b.id)).length })),
    sort: MSORT, sortVal: sort,
    body: `<div class="card">${all.slice(0, listN).map((x, i) => `<div class="rank-row" data-kit-item="veg/${x.b.id}"><span class="n">${i + 1}</span><span class="l">${esc(x.b.name)} <span class="muted" style="font-size:12px">${x.b.group}</span></span>
      <span class="p">${yuan(x.s.last)} 元/斤</span><span class="c ${cls(x.s.d7)}" title="较 7 天前">${pct(x.s.d7)}</span><span class="c ${cls(x.s.d30)}" title="较 30 天前">${pct(x.s.d30)}</span></div>`).join('') || '<div class="empty">暂无</div>'}</div>
      <p class="note">右侧两列分别是较 7 天前、较 30 天前的涨跌。</p>`,
    more: all.length > listN ? `加载更多（${listN} / ${all.length}）` : '' });
});
document.addEventListener('click', e => { if (e.target.closest('[data-kit-more]')) { listN += LPAGE; render(); } });
document.addEventListener('change', e => { if (e.target.matches('[data-kit-sort]')) location.hash = moversHref(KIT.parse()?.q.get('g') || '', e.target.value); });
window.addEventListener('hashchange', () => { if (KIT.parse()?.kind !== 'item') listN = LPAGE; }, true);
// 跨过手机 / 电脑宽度时重画图表（viewBox 宽度不同）
let wasNarrow = narrow();
addEventListener('resize', () => { if (narrow() === wasNarrow || !D) return; wasNarrow = narrow(); render(); KIT.boot(); });

// ── 交互 ──
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { goView(go.dataset.go); window.scrollTo({ top: 0 }); return; }
  const rg = e.target.closest('[data-range]');
  if (rg) { state.range = +rg.dataset.range; store.set('range', state.range); render(); return; }
  if (e.target.closest('#cpiTable')) { state.cpiTable = !state.cpiTable; render(); }
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); if (state.q && (state.view === 'home' || KIT.parse()?.kind === 'list')) goView(state.view === 'home' ? 'prices' : state.view); else render(); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; state.q = ''; render(); $('#q').blur(); }
});
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#theme').textContent = t === 'light' ? '☀' : '☾';
}
applyTheme(store.get('theme', 'dark'));
$('#theme').onclick = () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; store.set('theme', t); applyTheme(t); };

async function load() {
  const btn = $('#reload');
  btn.classList.add('spin');
  try {
    const r = await fetch('data.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
    $('#updated').textContent = '更新于 ' + ago(D.updated);
    render();
    KIT.boot();
  } catch (err) {
    console.warn('[FoodPrices]', err);
    if (!D) $('#main').innerHTML = `<div class="card empty">数据读取失败（${esc(err.message)}），稍后点右上角 ↻ 重试</div>`;
  } finally {
    btn.classList.remove('spin');
  }
}
$('#reload').onclick = load;
KIT.init(render);
load();
setInterval(() => { if (D) $('#updated').textContent = '更新于 ' + ago(D.updated); }, 60 * 1000);
</script>
</body>
</html>
