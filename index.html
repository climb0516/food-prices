<!DOCTYPE html>
<!-- Created by 青云 on 2026/10/21. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>菜价物价 · 猪肉 鸡蛋 蔬菜 CPI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080a08;
      --panel: rgba(20,26,20,0.82);
      --panel-2: rgba(255,255,255,0.03);
      --hover: rgba(255,255,255,0.045);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.14);
      --grid: rgba(255,255,255,0.06);
      --text-1: #eef3ec;
      --text-2: #aab5a6;
      --text-3: #6f7a6b;
      --accent: #4ade80;
      --grad: linear-gradient(120deg, #4ade80 0%, #a3e635 50%, #facc15 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(74,222,128,0.11);
      --glow-2: rgba(250,204,21,0.07);
      --up: #f05252;          /* 涨：红（国内习惯），始终配 ▲ */
      --down: #22c55e;        /* 跌：绿，始终配 ▼ */
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;   /* 图表分类色（深色模式色阶） */
      --ok: #22c55e;
      --err: #ef4444;
      --kbd-bg: rgba(255,255,255,0.06);
    }
    :root[data-theme="light"] {
      --bg: #f8faf7;
      --panel: rgba(255,255,255,0.93);
      --panel-2: rgba(10,40,10,0.025);
      --hover: rgba(10,40,10,0.04);
      --line: rgba(10,40,10,0.08);
      --line-2: rgba(10,40,10,0.16);
      --grid: rgba(10,40,10,0.07);
      --text-1: #121a10;
      --text-2: #4e5a4a;
      --text-3: #8b9686;
      --accent: #16a34a;
      --grid-dot: rgba(10,40,10,0.06);
      --glow-1: rgba(74,222,128,0.09);
      --glow-2: rgba(250,204,21,0.06);
      --up: #dc2626;
      --down: #15803d;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
      --kbd-bg: rgba(10,40,10,0.05);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px 400px at 15% -5%, var(--glow-1), transparent 70%),
        radial-gradient(700px 500px at 95% 0%, var(--glow-2), transparent 70%),
        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 20px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; font-size: 15px; box-shadow: 0 0 20px var(--glow-1); }
    .logo small { font-weight: 500; font-size: 12px; color: var(--text-3); letter-spacing: 0; }
    .search {
      flex: 1; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 36px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow-1); }
    .search svg { color: var(--text-3); flex: none; }
    .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text-1); font: inherit; font-size: 13.5px; }
    .search input::placeholder { color: var(--text-3); }
    kbd { font-family: inherit; font-size: 11px; color: var(--text-3); background: var(--kbd-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
    .top-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .updated { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(34,197,94,0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
    .icon-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; display: grid; place-items: center; color: var(--text-2); flex: none; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout { max-width: 1400px; margin: 0 auto; padding: 24px 24px 64px; display: grid; grid-template-columns: 180px minmax(0, 1fr) 290px; gap: 24px; align-items: start; }
    .side { position: sticky; top: 84px; }
    .side-title { font-size: 11.5px; color: var(--text-3); padding: 0 10px; margin: 4px 0 8px; letter-spacing: .04em; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: none; background: none; cursor: pointer; text-align: left; color: var(--text-2); font-size: 13.5px; position: relative; }
    .nav-item:hover { background: var(--hover); color: var(--text-1); }
    .nav-item.active { background: var(--panel); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--grad); }

    .main-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .main-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .main-head h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .main-head p { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
    .tabs { display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
    .tab { padding: 5px 11px; border-radius: 7px; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--text-3); white-space: nowrap; }
    .tab:hover { color: var(--text-1); }
    .tab.active { background: var(--hover); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line-2); }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .muted { color: var(--text-3); }
    .empty { text-align: center; padding: 40px 0; color: var(--text-3); }
    .loading { padding: 80px 0; text-align: center; color: var(--text-3); }
    .section-title { font-size: 13px; color: var(--text-3); margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .section-title:first-child { margin-top: 0; }
    .section-title b { color: var(--text-1); font-size: 15px; }
    .note { font-size: 12px; color: var(--text-3); margin-top: 10px; line-height: 1.6; }
    .num { font-variant-numeric: tabular-nums; }
    .up { color: var(--up); }
    .down { color: var(--down); }

    /* ── KPI ── */
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 8px; }
    .kpi { padding: 14px 16px; }
    .kpi .k { font-size: 12px; color: var(--text-3); }
    .kpi .v { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
    .kpi .v small { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 3px; }
    .kpi .s { font-size: 12.5px; color: var(--text-2); display: flex; gap: 10px; flex-wrap: wrap; }
    .kpi svg { display: block; margin-top: 6px; width: 100%; }   /* 跟随卡片宽度，手机两列时不撑破 */

    /* ── Price table ── */
    .ptable { width: 100%; border-collapse: collapse; }
    .ptable th { font-size: 12px; font-weight: 500; color: var(--text-3); text-align: right; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .ptable th:first-child { text-align: left; }
    .ptable td { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ptable td:first-child { text-align: left; }
    .ptable tr.row { cursor: pointer; }
    .ptable tr.row:hover td { background: var(--hover); }
    .ptable tr.row.open td { background: var(--hover); }
    .ptable tr.grp td { font-size: 12px; color: var(--text-3); background: var(--panel-2); padding: 6px 14px; text-align: left; }
    .ptable tr:last-child td { border-bottom: none; }
    .ptable .price { font-weight: 700; font-size: 14.5px; }
    .ptable .spark { width: 110px; }
    .ptable tr.detail td { padding: 4px 14px 14px; cursor: default; text-align: left; white-space: normal; }
    .stale { font-size: 11px; color: var(--text-3); margin-left: 4px; }

    /* ── Charts ── */
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line-2); border-radius: 9px; padding: 7px 10px; font-size: 12px; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transition: opacity .1s; z-index: 5; }
    .chart .tip b { display: block; font-size: 12px; color: var(--text-3); font-weight: 500; margin-bottom: 2px; }
    .chart .tip .r { display: flex; align-items: center; gap: 6px; color: var(--text-1); }
    .chart .tip i { width: 10px; height: 2px; border-radius: 1px; display: inline-block; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
    .chart-card { padding: 16px 16px 10px; }
    .chart-meta { display: flex; gap: 18px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; margin-bottom: 8px; }
    .chart-meta b { color: var(--text-1); font-variant-numeric: tabular-nums; }

    /* ── Rank / index ── */
    .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .rank-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
    .rank-row:last-child { border-bottom: none; }
    .rank-row .n { width: 18px; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
    .rank-row .l { flex: 1; min-width: 0; }
    .rank-row .p { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 12.5px; }
    .rank-row .c { width: 64px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .idx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .idx { padding: 12px 14px; }
    .idx .k { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .idx .v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .idx .s { font-size: 12px; font-variant-numeric: tabular-nums; }

    /* ── CPI ── */
    .bars { display: flex; flex-direction: column; gap: 7px; padding: 14px 16px; }
    .bar-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 62px; align-items: center; gap: 10px; font-size: 13px; }
    .bar-row .lab { color: var(--text-2); white-space: nowrap; }
    .bar-row .track { position: relative; height: 14px; }
    .bar-row .track::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line-2); }
    .bar-row .fill { position: absolute; top: 2px; height: 10px; border-radius: 4px; }
    .bar-row .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .say { padding: 14px 16px; font-size: 13.5px; color: var(--text-2); line-height: 1.8; }
    .say b { color: var(--text-1); }
    .ctable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .ctable th, .ctable td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ctable th:first-child, .ctable td:first-child { text-align: left; }
    .ctable th { color: var(--text-3); font-weight: 500; }
    .scroll-x { overflow-x: auto; }
    .linkbtn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12.5px; }

    /* ── Aside ── */
    .aside { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 14px; }
    .widget { padding: 14px 16px; }
    .widget h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .w-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
    .w-row:last-child { border-bottom: none; }
    .w-row .l { color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .w-row .r { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .st-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--ok); }
    .st-dot.bad { background: var(--err); }
    .st-dot.stale { background: #f59e0b; }
    .w-note { font-size: 12px; color: var(--text-3); line-height: 1.65; }

    @media (max-width: 1180px) {
      .layout { grid-template-columns: 160px minmax(0, 1fr); }
      .aside { display: none; }
    }
    @media (max-width: 860px) {
      .topbar-inner { padding: 0 16px; gap: 10px; }
      .logo small, .updated, kbd, .top-right a.icon-btn { display: none; }
      .logo { font-size: 15px; }
      .search { min-width: 0; flex: 1 1 0; }
      .layout { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 48px; gap: 16px; }
      .side { position: static; }
      .side-title { display: none; }
      .side nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
      .nav-item { width: auto; white-space: nowrap; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two { grid-template-columns: minmax(0, 1fr); }
      .ptable th, .ptable td { padding: 8px 8px; }
      .ptable .hide-m { display: none; }
      .ptable .spark { width: 72px; }
      .bar-row { grid-template-columns: 70px minmax(0, 1fr) 54px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><div class="logo-mark">🥬</div>菜价物价 <small>批发价 · 全国指数 · CPI</small></div>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索品种，如 猪肉、鸡蛋、西红柿…" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
      <div class="top-right">
        <div class="updated"><i class="live-dot"></i><span id="updated">读取中…</span></div>
        <button class="icon-btn" id="reload" title="重新读取数据"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
        <a class="icon-btn" href="https://github.com/climb0516/food-prices/actions/workflows/scrape.yml" target="_blank" rel="noopener" title="到 GitHub Actions 手动触发抓取">⚡</a>
        <button class="icon-btn" id="theme" title="切换深浅色">☾</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="side-title">视图</div>
      <nav id="nav"></nav>
    </aside>
    <main id="main"><div class="loading">加载中…</div></main>
    <aside class="aside" id="aside"></aside>
  </div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('fp:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fp:' + k, JSON.stringify(v)); } catch {} },
};
const GROUPS = ['肉', '蛋', '菜', '果', '鱼虾'];
const CPI_NAME = { cpi: 'CPI 总体', food: '食品', core: '核心 CPI', pork: '猪肉', veg: '鲜菜', egg: '蛋类', fruit: '鲜果', beef: '牛肉', mutton: '羊肉', aquatic: '水产品', grain: '粮食', oil: '食用油', meat: '畜肉类' };
const CPI_LINES = [['cpi', 'var(--s1)'], ['pork', 'var(--s2)'], ['veg', 'var(--s3)'], ['egg', 'var(--s4)']];   // 固定顺序，颜色跟着品类走

let D = null;
const state = { view: store.get('view', 'home'), q: '', range: store.get('range', 90), open: null, cpiTable: false };

// ── 工具 ──
const pct = v => v == null || !isFinite(v) ? '—' : `${v > 0 ? '▲' : v < 0 ? '▼' : ''}${Math.abs(v).toFixed(1)}%`;
const cls = v => v > 0.05 ? 'up' : v < -0.05 ? 'down' : 'muted';
const yuan = v => v == null ? '—' : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
const md = iso => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
const ym = m => `${m.slice(2, 4)}.${+m.slice(5)}`;
function ago(t) {
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

// 单品：最新价、N 天前的价（取不晚于该日的最近一个报价）
function series(id) { return Object.entries(D.xinfadi[id] || {}); }
function stat(id) {
  const s = series(id);
  if (!s.length) return null;
  const [lastDay, last] = s.at(-1);
  const before = n => { const cut = addDays(lastDay, -n); for (let i = s.length - 1; i >= 0; i--) if (s[i][0] <= cut) return s[i][1]; return null; };
  const chg = n => { const b = before(n); return b ? (last / b - 1) * 100 : null; };
  const vals = s.slice(-90).map(x => x[1]);
  return { last, lastDay, d1: chg(1), d7: chg(7), d30: chg(30), min: Math.min(...vals), max: Math.max(...vals), avg: vals.reduce((a, b) => a + b, 0) / vals.length };
}

// ── 图表（纯 SVG） ──
const CHARTS = {};
let chartSeq = 0;
function sparkline(points, w = 110, h = 28, color = 'var(--text-2)') {
  if (points.length < 2) return '';
  const ys = points.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${(i / (points.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (p[1] - lo) / span * (h - 6)).toFixed(1)}`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
// lines: [{name, color, points:[[xLabel, y]]}]，所有线共用同一组 x；fmt 格式化 y；zero 是否画 0 线
function lineChart(lines, { height = 240, fmt = v => v, zero = false, unit = '', xfmt = x => x } = {}) {
  const id = 'c' + (++chartSeq);
  const W = 720, H = height, L = 46, R = 16, T = 12, B = 26;
  const xs = lines[0].points.map(p => p[0]);
  const all = lines.flatMap(l => l.points.map(p => p[1])).filter(v => v != null);
  let lo = Math.min(...all), hi = Math.max(...all);
  if (zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const x = i => L + (xs.length < 2 ? 0 : i / (xs.length - 1) * (W - L - R));
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = 4, grid = Array.from({ length: ticks + 1 }, (_, i) => lo + (hi - lo) * i / ticks);
  const step = Math.max(1, Math.ceil(xs.length / 6));
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lines.map(l => l.name).join('、'))}走势">
    ${grid.map(g => `<line x1="${L}" x2="${W - R}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${L - 8}" y="${(y(g) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--text-3)">${esc(fmt(g))}</text>`).join('')}
    ${zero && lo < 0 && hi > 0 ? `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)" stroke-width="1"/>` : ''}
    ${xs.map((v, i) => i % step === 0 || i === xs.length - 1 ? `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === xs.length - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--text-3)">${esc(xfmt(v))}</text>` : '').join('')}
    ${lines.map(l => {
      let d = '', pen = false;
      l.points.forEach((p, i) => { if (p[1] == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`; pen = true; });
      return `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }).join('')}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    ${lines.map((l, k) => `<circle class="dot" data-k="${k}" r="4" fill="${l.color}" stroke="var(--bg)" stroke-width="2" opacity="0"/>`).join('')}
    <rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
  </svg>`;
  CHARTS[id] = { lines, xs, x, y, W, fmt, unit, xfmt };
  return `<div class="chart" data-chart="${id}">${svg}<div class="tip"></div></div>`;
}
// 悬停：十字线 + 提示框（事件委托）
document.addEventListener('pointermove', e => {
  const box = e.target.closest?.('.chart');
  document.querySelectorAll('.chart').forEach(c => { if (c !== box) hideTip(c); });
  if (!box) return;
  const c = CHARTS[box.dataset.chart]; if (!c) return;
  const svg = box.querySelector('svg'), r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * c.W;
  let best = 0, bd = Infinity;
  c.xs.forEach((_, i) => { const d = Math.abs(c.x(i) - sx); if (d < bd) { bd = d; best = i; } });
  const px = c.x(best);
  const xh = svg.querySelector('.xh'); xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('opacity', 1);
  svg.querySelectorAll('.dot').forEach(dot => {
    const v = c.lines[dot.dataset.k].points[best]?.[1];
    if (v == null) { dot.setAttribute('opacity', 0); return; }
    dot.setAttribute('cx', px); dot.setAttribute('cy', c.y(v)); dot.setAttribute('opacity', 1);
  });
  const tip = box.querySelector('.tip');
  tip.innerHTML = `<b>${esc(c.xfmt(c.xs[best], true))}</b>${c.lines.map(l => { const v = l.points[best]?.[1]; return v == null ? '' : `<div class="r"><i style="background:${l.color}"></i>${esc(l.name)} <span class="num">${esc(c.fmt(v, true))}${c.unit}</span></div>`; }).join('')}`;
  tip.style.opacity = 1;
  const bx = box.getBoundingClientRect(), left = px / c.W * r.width;
  tip.style.left = Math.min(Math.max(0, left + 12), bx.width - tip.offsetWidth) + 'px';
  tip.style.top = '6px';
});
function hideTip(box) {
  box.querySelector('.tip') && (box.querySelector('.tip').style.opacity = 0);
  box.querySelectorAll('.xh,.dot').forEach(n => n.setAttribute('opacity', 0));
}

function moverRow(x, i) {

function viewPrices() {

// ── 视图：CPI ──
function viewCPI() {
  const months = Object.keys(D.cpi).slice(-24), m = months.at(-1), c = D.cpi[m] || {};
  const lines = CPI_LINES.map(([k, color]) => ({ name: CPI_NAME[k], color, points: months.map(mm => [mm, D.cpi[mm][k]?.yoy ?? null]) }));
  const keys = ['cpi', 'food', 'core', 'pork', 'beef', 'mutton', 'egg', 'veg', 'fruit', 'aquatic', 'grain', 'oil'].filter(k => c[k]);
  const maxAbs = Math.max(...keys.map(k => Math.abs(c[k].yoy)), 1);
  return `<div class="main-head"><div><h1>📊 CPI 居民消费价格</h1><p>国家统计局每月中旬发布；同比 = 和去年同月比</p></div>
      <button class="btn tab" id="cpiTable">${state.cpiTable ? '看图' : '看表格'}</button></div>
    ${state.cpiTable ? cpiTable(months) : `<div class="card chart-card"><div class="legend">${lines.map(l => `<span><i style="background:${l.color}"></i>${esc(l.name)}</span>`).join('')}</div>
      ${lineChart(lines, { height: 260, zero: true, fmt: (v, full) => (v > 0 ? '+' : '') + v.toFixed(full ? 1 : 0) + '%', xfmt: (mm, full) => full ? `${mm.slice(0, 4)} 年 ${+mm.slice(5)} 月` : ym(mm) })}</div>`}
    ${cpiSay(m, c)}
    <div class="section-title"><b>${m ? `${+m.slice(5)} 月各品类同比` : ''}</b><span>中线为 0，右边是涨、左边是跌</span></div>
    <div class="card bars">${keys.map(k => { const v = c[k].yoy, w = Math.abs(v) / maxAbs * 50;
      return `<div class="bar-row" title="环比 ${pct(c[k].mom)}"><span class="lab">${CPI_NAME[k]}</span><span class="track"><span class="fill" style="${v >= 0 ? `left:50%` : `left:${50 - w}%`};width:${Math.max(w, 0.5)}%;background:${v >= 0 ? 'var(--up)' : 'var(--down)'}"></span></span><span class="val ${cls(v)}">${pct(v)}</span></div>`; }).join('')}</div>

}

  const go = e.target.closest('[data-go]');
  if (go) { state.view = go.dataset.go; store.set('view', state.view); render(); window.scrollTo({ top: 0 }); return; }
  const op = e.target.closest('[data-open]');

  if (rg) { state.range = +rg.dataset.range; store.set('range', state.range); render(); return; }

  $('#theme').textContent = t === 'light' ? '☀' : '☾';
}
applyTheme(store.get('theme', 'dark'));
$('#theme').onclick = () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; store.set('theme', t); applyTheme(t); };

async function load() {
  const btn = $('#reload');
  btn.classList.add('spin');
  try {
    const r = await fetch('data.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
    $('#updated').textContent = '更新于 ' + ago(D.updated);
    render();
  } catch (err) {
    console.warn('[FoodPrices]', err);
    if (!D) $('#main').innerHTML = `<div class="card empty">数据读取失败（${esc(err.message)}），稍后点右上角 ↻ 重试</div>`;
  } finally {
    btn.classList.remove('spin');
  }
}
$('#reload').onclick = load;
load();
setInterval(() => { if (D) $('#updated').textContent = '更新于 ' + ago(D.updated); }, 60 * 1000);
</script>
</body>
</html>
